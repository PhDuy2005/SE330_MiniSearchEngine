spring.application.name=MiniSearchEngine

# config database
###
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/se330
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
###

#config auth
mini-search.jwt.base64-secret=CQxHhfO1ZPMHDzW1SNlKuRoq+aXNDI2bvdOliVPzEQJDFA+eyTLOSljP+q9wIQCGXGPUIHAc+A07VzEnc9XbJg==
mini-search.jwt.access-token-validity-in-seconds=864000
mini-search.jwt.refresh-token-validity-in-seconds=864000
mini-search.cors.allowed-origins=http://localhost:5173

# config mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
mini-search.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
mini-search.otp.validity-in-minutes=${OTP_VALIDITY_IN_MINUTES:5}

#re-config dev tool
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

#config actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
